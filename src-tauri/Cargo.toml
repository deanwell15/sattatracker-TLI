[package]
name = "deanfinite"
version = "1.2.11"
description = "Deanfinite — Torchlight: Infinite Loot Tracker"
authors = ["sattatrapy"]
license = "MIT"
edition = "2021"
default-run = "Deanfinite"

[[bin]]
name = "Deanfinite"
path = "src/main.rs"

[lib]
name = "deanfinite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
tauri-plugin-global-shortcut = "2.3.1"
linemux = "0.3.0"
regex = "1.12.3"
tokio = { version = "1.51.1", features = ["full"] }
sysinfo = "0.38.4"
lazy_static = "1.5.0"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

