name: Deanfinite Windows test build

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Fast: replace EXE in existing kit; Full: kit + MSI + NSIS'
        type: choice
        options: [fast, full]
        default: fast
        required: true
      live_prices:
        description: 'Full only: separate non-gating real read-only Supabase diagnostic'
        type: boolean
        default: false
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    # Preserve the pre-existing Full check name for branch protection.
    name: ${{ matrix.mode == 'full' && 'build-windows' || 'build-windows (fast)' }}
    if: github.repository == 'deanwell15/sattatracker-TLI'
    # PRs verify BOTH modes. Manual runs build only the selected mode.
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(github.event_name == 'pull_request' && '["full","fast"]' || (inputs.build_mode == 'full' && '["full"]' || '["fast"]')) }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      RUST_TARGET: x86_64-pc-windows-msvc
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      CARGO_TERM_COLOR: always
      # Fast has the same code/resources, with cheaper release optimization.
      # Keep production Full optimization unchanged. Never reuse across modes.
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.mode == 'fast' && 'false' || 'true' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.mode == 'fast' && '16' || '1' }}

    steps:
      - name: Check out the requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend and Tauri CLI from package-lock.json
        run: npm ci

      - name: Typecheck frontend
        run: node node_modules/vue-tsc/bin/vue-tsc.js --noEmit

      - name: Test Fast artifact and resource compatibility contract
        run: node --test tests/fast-build.test.mjs

      - name: Test price valuations and lossless loot accounting
        run: npm run test:pricing

      # Controlled fixtures only: never makes a live Supabase request in CI.
      - name: Test read-only TITrack diagnostic without network
        run: python tools/check-titrack-api.py --self-test

      # Uses Chrome already installed on windows-2022. No browser download.
      - name: Test offline graphics and widget rendering
        run: npm run test:assets

      # MSVC, Windows SDK and rustup are provided by the Microsoft-hosted image.
      # Fail explicitly if the image stops providing the required C++ tools.
      - name: Verify Windows build prerequisites
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (!(Test-Path -LiteralPath $vswhere)) {
            throw 'Visual Studio Installer/vswhere.exe is missing from the runner.'
          }
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!$visualStudio) { throw 'MSVC x64/x86 build tools are missing.' }
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Include'
          $sdkVersions = @(Get-ChildItem -LiteralPath $sdkRoot -Directory |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'um/Windows.h') })
          if ($sdkVersions.Count -eq 0) { throw 'Windows SDK headers are missing.' }
          Write-Output "Visual Studio: $visualStudio"
          $sdkVersions | ForEach-Object { Write-Output "Windows SDK: $($_.Name)" }

      - name: Install the pinned Rust toolchain and Windows target
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --target $env:RUST_TARGET

      # Immutable caches are scoped by OS/compiler/target/optimization/lock.
      # Restore older source keys to reuse dependencies; Cargo checks fingerprints.
      # PR merge-ref caches cannot poison main; no pull_request_target or secrets.
      - name: Cache Cargo downloads and compiled dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            src-tauri/target
          key: windows2022-rust1.99.1-x64-${{ matrix.mode }}-v1-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/src/**', 'src-tauri/build.rs', 'src-tauri/Cargo.toml', 'src-tauri/tauri*.json', 'src/**', 'package-lock.json', 'vite.config.*', 'assets/**') }}
          restore-keys: |
            windows2022-rust1.99.1-x64-${{ matrix.mode }}-v1-${{ hashFiles('src-tauri/Cargo.lock') }}-

      - name: Build frontend and Fast Windows EXE without installers
        if: matrix.mode == 'fast'
        run: npm run tauri -- build --ci --target $env:RUST_TARGET --no-bundle -- --locked

      # tauri.conf.json beforeBuildCommand runs npm run build (vue-tsc + Vite).
      # Arguments after -- are passed to Cargo, so Cargo.lock is enforced.
      # Tauri's bundler obtains its WiX/NSIS packaging tools; no app is launched.
      - name: Build frontend and Windows installers
        if: matrix.mode == 'full'
        run: npm run tauri -- build --ci --target $env:RUST_TARGET --bundles "nsis,msi" -- --locked

      - name: Test pricing, parser integration, settings and icon access
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --target $env:RUST_TARGET --lib

      # A separate best-effort diagnostic, not part of mandatory offline tests.
      # Same-repository PR Full builds exercise the real provider; manual Full
      # runs require explicit live_prices=true. Never runs in Fast or fork PRs.
      - name: Diagnose real TITrack cloud cache separately from offline tests
        if: matrix.mode == 'full' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || inputs.live_prices == true)
        env:
          DEANFINITE_LIVE_RESULT_PATH: ${{ github.workspace }}/LIVE_TITRACK_RESULT.json
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --release --target $env:RUST_TARGET --lib live_titrack_populates_isolated_cloud_cache -- --ignored --nocapture
          $diagnosticExit = $LASTEXITCODE
          if (!(Test-Path LIVE_TITRACK_RESULT.json)) {
            @{ live_verified = $false; error = 'Diagnostic did not produce a result'; exitCode = $diagnosticExit } |
              ConvertTo-Json | Set-Content LIVE_TITRACK_RESULT.json -Encoding utf8
          }
          if ($diagnosticExit -ne 0) { Write-Output '::warning::Live TITrack cloud cache was NOT verified. See LIVE_TITRACK_RESULT.json; offline tests remain separate.' }
          exit 0

      - name: Verify original graphics in Windows installer payloads
        if: matrix.mode == 'full'
        run: ./tools/verify-windows-bundles.ps1 -ReleaseRoot (Join-Path $env:CARGO_TARGET_DIR "$env:RUST_TARGET/release")

      - name: Verify dependency lock files were not changed
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock

      - name: Collect installers, standalone EXE and build metadata
        if: matrix.mode == 'full'
        run: |
          $releaseRoot = Join-Path $env:CARGO_TARGET_DIR "$env:RUST_TARGET/release"
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $standaloneRoot = Join-Path $outputRoot 'standalone'
          New-Item -ItemType Directory -Path $standaloneRoot -Force | Out-Null

          foreach ($format in @('msi', 'nsis')) {
            $extension = if ($format -eq 'msi') { '*.msi' } else { '*.exe' }
            $source = Join-Path $releaseRoot "bundle/$format"
            $installers = @(Get-ChildItem -LiteralPath $source -Filter $extension -File -Recurse)
            if ($installers.Count -eq 0) { throw "No $format installer was produced." }
            if (@($installers | Where-Object { $_.Name -cnotlike 'Deanfinite*' }).Count -gt 0) {
              throw "Unexpected $format installer product name."
            }
            $destination = Join-Path $outputRoot "installers/$format"
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            $installers | Copy-Item -Destination $destination
          }

          $application = Join-Path $releaseRoot 'Deanfinite.exe'
          if (!(Test-Path -LiteralPath $application)) { throw 'Standalone application EXE is missing.' }
          if ((Get-Item -LiteralPath $application).Name -cne 'Deanfinite.exe') { throw 'Incorrect EXE filename casing.' }
          Copy-Item -LiteralPath $application -Destination $standaloneRoot
          Copy-Item -LiteralPath (Join-Path $releaseRoot 'icons') -Destination (Join-Path $standaloneRoot 'icons') -Recurse
          $assetManifest = Get-Content -LiteralPath 'assets/original-assets.manifest.json' -Raw | ConvertFrom-Json
          foreach ($entry in @($assetManifest.files | Where-Object { $_.path.StartsWith('src-tauri/resources/icons/') })) {
            $icon = Join-Path $standaloneRoot ('icons/' + [System.IO.Path]::GetFileName($entry.path))
            if (!(Test-Path -LiteralPath $icon)) { throw "Standalone icon missing: $icon" }
            if ((Get-FileHash -LiteralPath $icon -Algorithm SHA256).Hash.ToLowerInvariant() -cne $entry.sha256) {
              throw "Standalone icon checksum mismatch: $icon"
            }
          }
          Copy-Item -LiteralPath 'assets/original-assets.manifest.json' -Destination (Join-Path $outputRoot 'ORIGINAL_ASSETS.json')
          if (Test-Path LIVE_TITRACK_RESULT.json) { Copy-Item LIVE_TITRACK_RESULT.json $outputRoot }
          Copy-Item 'docs/TITRACK_SYNC_FAST_BUILD_REPORT.md' (Join-Path $outputRoot 'TITRACK_SYNC_FAST_BUILD_REPORT.md')
          Copy-Item -LiteralPath 'LICENSE' -Destination $outputRoot
          Copy-Item -LiteralPath 'ASSET_LICENSES.md' -Destination $outputRoot

          @'
          This is an unsigned test build of Deanfinite (deanwell15/sattatracker-TLI).
          installers/msi: MSI installer. installers/nsis: NSIS setup EXE.
          standalone/: installation-free KIT. Keep Deanfinite.exe and icons/ together.
          Copying only Deanfinite.exe loses item icons; this EXE is NOT self-contained.
          The standalone EXE requires a separately installed Microsoft Edge WebView2 Runtime.
          It is NOT a fully portable/offline package: the existing app still requests
          administrator privileges, stores config.json in its own AppConfig directory, uses LocalAppData
          and WebView storage. Automatic uses read-only TITrack HTTPS; Local JSON prices work fully offline.
          Original item icons and animation frames are bundled; no remote graphics/fonts are loaded.
          See ASSET_LICENSES.md for original resource provenance and rights notices.
          Deanfinite uses io.github.deanwell15.deanfinite and separate app data.
          No SattaTracker settings are imported. Do not run two Deanfinite copies together.
          SHA256SUMS.txt verifies file consistency; it is not a digital signature.
          A successful CI build does not prove the game parser, overlay or accounting work.
          '@ | Set-Content -LiteralPath (Join-Path $outputRoot 'RUNNING.txt') -Encoding utf8

          Copy-Item -LiteralPath 'docs/pricing.md' -Destination (Join-Path $outputRoot 'PRICING_REPORT.md')
          Copy-Item -LiteralPath 'docs/TITRACK_INTEGRATION_REPORT.md' -Destination (Join-Path $outputRoot 'TITRACK_INTEGRATION_REPORT.md')
          $pricingEvidence = @"

          ## Фактические проверки Windows runner

          Tauri build MSI/NSIS, frontend, pricing/store tests, Chromium smoke,
          cargo test --lib и проверка payload установщиков прошли до создания артефакта.
          Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          Артефакт не подтверждает live API TITrack или ручную проверку новой версии в игре.
          Итог всего workflow, включая upload, проверяйте по ссылке Run.
          "@
          Add-Content -LiteralPath (Join-Path $outputRoot 'PRICING_REPORT.md') -Value $pricingEvidence -Encoding utf8
          Add-Content -LiteralPath (Join-Path $outputRoot 'TITRACK_INTEGRATION_REPORT.md') -Value $pricingEvidence -Encoding utf8

          $package = Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json
          $tauri = Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nodeVersion = node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $npmVersion = npm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rustVersion = rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cargoVersion = cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            commit = $commit
            ref = $env:GITHUB_REF
            event = $env:GITHUB_EVENT_NAME
            runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            version = $package.version
            packageName = $package.name
            productName = $tauri.productName
            mainBinaryName = $tauri.mainBinaryName
            identifier = $tauri.identifier
            target = $env:RUST_TARGET
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            node = $nodeVersion
            npm = $npmVersion
            rust = $rustVersion
            cargo = $cargoVersion
            npmLockSha256 = (Get-FileHash -LiteralPath 'package-lock.json' -Algorithm SHA256).Hash.ToLowerInvariant()
            originalAssetsSha256 = $assetManifest.archive_sha256
            originalAssetsFiles = $assetManifest.file_count
            originalAssetsBytes = $assetManifest.total_bytes
            standaloneFormat = 'Deanfinite.exe + icons/; WebView2 separately required'
            cargoLockSha256 = (Get-FileHash -LiteralPath 'src-tauri/Cargo.lock' -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $metadata | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $outputRoot 'BUILD_INFO.json') -Encoding utf8

          $checksums = @(Get-ChildItem -LiteralPath $outputRoot -File -Recurse |
            Sort-Object FullName | ForEach-Object {
              $relativePath = [System.IO.Path]::GetRelativePath($outputRoot, $_.FullName).Replace('\', '/')
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relativePath"
            })
          $checksums | Set-Content -LiteralPath (Join-Path $outputRoot 'SHA256SUMS.txt') -Encoding utf8

      - name: Collect Fast EXE replacement and verify existing-kit compatibility
        if: matrix.mode == 'fast'
        run: |
          $releaseRoot = Join-Path $env:CARGO_TARGET_DIR "$env:RUST_TARGET/release"
          node tools/prepare-fast-build.mjs $releaseRoot artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/check-standalone-kit.ps1 -KitRoot $releaseRoot -ContractPath artifacts/RESOURCE_COMPATIBILITY.json
          $badContract = Join-Path $env:RUNNER_TEMP 'deanfinite-wrong-resource-contract.json'
          $wrong = Get-Content artifacts/RESOURCE_COMPATIBILITY.json -Raw | ConvertFrom-Json
          $wrong.iconsSha256 = '0' * 64
          $wrong | ConvertTo-Json | Set-Content $badContract -Encoding utf8
          $rejected = $false
          try { ./tools/check-standalone-kit.ps1 -KitRoot $releaseRoot -ContractPath $badContract }
          catch { $rejected = $true }
          if (!$rejected) { throw 'Compatibility check accepted a wrong resource edition.' }
          # Fast's fresh cache namespace never runs a bundler. Reject installers.
          if (Test-Path -LiteralPath (Join-Path $releaseRoot 'bundle')) { throw 'Fast build unexpectedly produced installer bundles.' }

      - name: Upload Windows test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deanfinite-windows-${{ matrix.mode }}-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
